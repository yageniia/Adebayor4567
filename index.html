<body>
  <script>
    // Keep two-finger gestures inside the map instead of letting the browser
    // zoom or pan the whole prototype. Flutter still receives the touch events
    // and handles map pinch-zoom through its gesture arena.
    const preventBrowserPinch = (event) => event.preventDefault();
    document.addEventListener('gesturestart', preventBrowserPinch, {
      passive: false,
    });
    document.addEventListener('gesturechange', preventBrowserPinch, {
      passive: false,
    });
    document.addEventListener('gestureend', preventBrowserPinch, {
      passive: false,
    });
    document.addEventListener(
      'touchmove',
      (event) => {
        if (event.touches.length > 1) event.preventDefault();
      },
      { passive: false },
    );

    // This is an actively iterated prototype: stale service-worker assets make
    // UI fixes appear broken after a rebuild. Remove old registrations and let
    // every reload use the files currently served from build/web.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) registration.unregister();
      });
    }
  </script>
